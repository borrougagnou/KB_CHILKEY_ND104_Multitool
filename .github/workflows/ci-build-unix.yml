name: Linux-Mac Build Test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PROGRAMS: "clock_update"
  #PROGRAMS: "clock_update weather_update picture_upload"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
#
# MAKE BUILD
#
  make-build:
    # https://github.com/actions/runner-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - os:           ubuntu-22.04
            target:       linux
            platform_dir: Linux
            make_cmd:     make
            artifact:     external-linux

          - os:           macos-14
            target:       macos
            platform_dir: Mac
            make_cmd:     gmake
            artifact:     external-macos

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Install deps
    - name: Install libusb (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev

    # Build
    - name: Build
      run: |
        for program in $PROGRAMS; do
          echo "Building $program..."
          make $program
        done

    # Execute (|| true to prevent the program fail if no HID device is connected)
    - name: Run executable
      run: |
        for bin in $PROGRAMS; do
          echo "Running $bin"
          ./$bin || true
        done

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: CHILKEY_ND104_Multitool-MAKE-${{ runner.os }}
        path: |
          clock_update
          #weather_update
          #picture_upload


#
# CMAKE BUILD
#
  cmake-build:
    # https://github.com/actions/runner-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - os:           ubuntu-22.04
            target:       linux
            platform_dir: Linux
            artifact:     external-linux

          - os:           macos-14
            target:       macos
            platform_dir: Mac
            artifact:     external-macos

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Install deps
    - name: Install libusb (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev

    # Build
    - name: Configure CMake
      run: cmake -S . -B cmake-build

    - name: Build
      run: |
        for program in $PROGRAMS; do
          echo "Building $program..."
          cmake --build cmake-build --config Release --target "$program"

          bin="cmake-build/$program"
          if [ ! -f "$bin" ]; then
            echo "Executable not found: $bin"
            echo "Contents of cmake-build:"
            find cmake-build -type f
            exit 1
          fi
          echo "Successfully built: $bin"
        done

    # Execute (|| true to prevent the program fail if no HID device is connected)
    - name: Run executable
      run: |
        for bin in $PROGRAMS; do
          echo "Running $bin"
          ./cmake-build/$bin || true
        done

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: CHILKEY_ND104_Multitool-CMAKE-${{ runner.os }}
        path: |
          cmake-build/clock_update
          clock_update
          #cmake-build/weather_update
          #weather_update
          #cmake-build/picture_upload
          #picture_upload

