name: Build libwebsockets

on:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXTERNAL_ROOT_REL: ${EXTERNAL_ROOT_REL}
  MAKEFILE_DEPS:     Makefile.deps

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2022
            msystem: mingw32
            name: windows-x32-xp
            arch: "x32"
          - os: windows-2022
            msystem: mingw64
            name: windows-x64
            arch: "x64"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            make
            mingw-w64-${{ matrix.msystem == 'mingw32' && 'i686' || 'x86_64' }}-gcc
            mingw-w64-${{ matrix.msystem == 'mingw32' && 'i686' || 'x86_64' }}-cmake

      - name: Build & Install (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd MakefileFolder/libwebsockets_build
          make -f Makefile.deps all
          cd ../..
          tar -czf libwebsockets-${{ matrix.name }}.tar.gz ${EXTERNAL_ROOT_REL}/libwebsockets/

      - name: Build & Install (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd MakefileFolder/libwebsockets_build
          make -f Makefile.deps all ARCH=${{ matrix.arch }}
          cd ../..
          tar -czf libwebsockets-${{ matrix.name }}.tar.gz ${EXTERNAL_ROOT_REL}/libwebsockets/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libwebsockets-${{ matrix.name }}
          path: libwebsockets-${{ matrix.name }}.tar.gz


