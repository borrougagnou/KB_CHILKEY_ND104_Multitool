##########################################################################
############################## RELEASE PART ##############################
##########################################################################

  release:
    name: Create GitHub Release

    needs:
      - build-linux
      - build-macos
      - build-windows-x86
      - build-windows-x64

    runs-on: ubuntu-latest

    steps:
      - name: Download Linux binary artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: release

      - name: Download macOS binary artifact
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: release

      - name: Download Windows x86 binary artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x86
          path: release

      - name: Download Windows x64 binary artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release

      - name: Show release files
        shell: bash
        run: |
          ls -lah release


      ## RELEASE PREPARATION

      - name: Prepare manual release notes
        if: github.event_name == 'workflow_dispatch' && inputs.release_notes != ''
        shell: bash
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          RELEASE_NOTES="${RELEASE_NOTES//\\n/$'\n'}"
          RELEASE_NOTES="${RELEASE_NOTES//\\t/$'\t'}"

          printf '%s\n' "$RELEASE_NOTES" > release-notes.md

          echo "Manual release notes:"
          cat release-notes.md

      - name: Prepare release information
        id: release_info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

              VERSION="${{ inputs.version }}"
              RELEASE_TYPE="${{ inputs.release_type }}"
              DRAFT="${{ inputs.draft }}"
              GENERATE_NOTES="${{ inputs.generate_notes }}"

          else

              VERSION="${{ github.ref_name }}"
              DRAFT="false"
              GENERATE_NOTES="true"

              if [[ "$VERSION" == *-alpha* ]]; then
                  RELEASE_TYPE="prerelease"
              else
                  RELEASE_TYPE="release"
              fi

              if [[ "$VERSION" == *-beta* ]]; then
                  RELEASE_TYPE="prerelease"
              else
                  RELEASE_TYPE="release"
              fi

          fi

          echo "version=$VERSION"               >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE"     >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT"                   >> "$GITHUB_OUTPUT"
          echo "generate_notes=$GENERATE_NOTES" >> "$GITHUB_OUTPUT"

          echo "Version:        $VERSION"
          echo "Release type:   $RELEASE_TYPE"
          echo "Draft:          $DRAFT"
          echo "Generate notes: $GENERATE_NOTES"


      ## PRE-RELEASE

      - name: Create pre-release
        if: steps.release_info.outputs.release_type == 'prerelease'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION="${{ steps.release_info.outputs.version }}"

          TARGET_ARGUMENT=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              TARGET_ARGUMENT="--target ${{ github.sha }}"
          else
              TARGET_ARGUMENT="--verify-tag"
          fi

          NOTES_ARGUMENT=""
          if [ "${{ steps.release_info.outputs.generate_notes }}" = "true" ]; then
              NOTES_ARGUMENT="--generate-notes"
          fi

          MANUAL_NOTES_ARGUMENT=""
          if [ -f "release-notes.md" ]; then
              MANUAL_NOTES_ARGUMENT="--notes-file release-notes.md"
          fi

          DRAFT_ARGUMENT=""
          if [ "${{ steps.release_info.outputs.draft }}" = "true" ]; then
              DRAFT_ARGUMENT="--draft"
          fi

          gh release create "$VERSION" \
              release/* \
              --title "$VERSION" \
              --prerelease \
              --latest=false \
              $TARGET_ARGUMENT \
              $NOTES_ARGUMENT \
              $MANUAL_NOTES_ARGUMENT \
              $DRAFT_ARGUMENT


      ## RELEASE

      - name: Create release
        if: steps.release_info.outputs.release_type == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION="${{ steps.release_info.outputs.version }}"

          TARGET_ARGUMENT=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              TARGET_ARGUMENT="--target ${{ github.sha }}"
          else
              TARGET_ARGUMENT="--verify-tag"
          fi

          NOTES_ARGUMENT=""
          if [ "${{ steps.release_info.outputs.generate_notes }}" = "true" ]; then
              NOTES_ARGUMENT="--generate-notes"
          fi

          MANUAL_NOTES_ARGUMENT=""
          if [ -f "release-notes.md" ]; then
              MANUAL_NOTES_ARGUMENT="--notes-file release-notes.md"
          fi

          DRAFT_ARGUMENT=""
          if [ "${{ steps.release_info.outputs.draft }}" = "true" ]; then
              DRAFT_ARGUMENT="--draft"
          fi

          gh release create "$VERSION" \
              release/* \
              --title "$VERSION" \
              --latest \
              $TARGET_ARGUMENT \
              $NOTES_ARGUMENT \
              $MANUAL_NOTES_ARGUMENT \
              $DRAFT_ARGUMENT

